services:
  # 1. Backend Web Service (Node.js API + SSE Stream + x402 Endpoints)
  - type: web
    name: agentgrid-server
    env: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3001
      - key: GEMINI_API_KEY
        sync: false
      - key: NODE_ENV
        value: production

  # 2. Frontend Static Site (React + Vite)
  - type: web
    name: agentgrid-client
    env: static
    plan: free
    region: oregon
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        fromService:
          type: web
          name: agentgrid-server
          property: host
